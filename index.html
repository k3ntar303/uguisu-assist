<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ウグイスアシスト</title>
<style>
:root{--g:#14532d;--g2:#1f7a45;--bg:#f3f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--acc:#e8590c;--blue:#1971c2;--line:#d8d4c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#222;font-family:system-ui,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit}
#app{max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
#root{display:flex;flex-direction:column;height:100%}
header.top{background:var(--g);color:#fff;display:flex;align-items:center;gap:6px;padding:5px 8px;min-height:46px;flex-shrink:0}
header.top h1{font-size:16px;margin:0;flex:1}
header.top .inn{flex:1;text-align:center;font-weight:700;font-size:16px;line-height:1.2}
header.top .inn small{display:block;font-weight:400;font-size:11px;opacity:.9}
.hb{background:#ffffff26;border:0;color:#fff;border-radius:8px;min-width:40px;height:36px;font-size:15px;padding:0 8px}
.view{flex:1;overflow:auto;min-height:0}
.view.gv{overflow:hidden;display:flex;flex-direction:column}
.sidetabs{display:flex;gap:4px;padding:4px 4px 0;flex-shrink:0}
.sidetabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:8px;padding:5px 2px;font-size:13px;font-weight:700;color:var(--mut);line-height:1.2}
.sidetabs button small{display:block;font-weight:400;font-size:10px}
.sidetabs button.on{border-color:var(--g);background:#e6f4ea;color:var(--g)}
.game{flex:1;min-height:0;display:flex}
.left{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px}
.field{position:relative;flex:0 0 40%;background:#cfe8c3;border-radius:10px;overflow:hidden}
.dia{position:absolute;left:50%;top:62%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#d9b77e88;border:2px solid #ffffffaa}
.fslot{position:absolute;transform:translate(-50%,-50%);width:62px;height:34px;background:#fff;border:2px solid var(--line);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;line-height:1.1;overflow:hidden}
.fslot .pl{font-size:9px;color:var(--g2);font-weight:700}
.fslot b{font-size:12px;white-space:nowrap}
.fslot.empty{background:#ffffff80;border-style:dashed}
.fbtn{position:absolute;bottom:3px;background:#fff;border:2px solid var(--g2);color:var(--g);border-radius:8px;height:28px;padding:0 10px;font-weight:700;font-size:13px}
.fbtn.l{left:3px}.fbtn.r{right:3px;border-color:#868e96;color:#495057}
.lower{flex:1;min-height:0;display:flex;gap:4px;margin-top:4px}
.notecol{width:62px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.notecol button{border:2px solid var(--g2);background:#fff;color:var(--g);border-radius:8px;font-size:11px;font-weight:700;line-height:1.25;padding:6px 3px;word-break:break-all;min-height:44px}
.order{flex:1;min-width:0;min-height:0;display:grid;grid-template-rows:repeat(9,minmax(0,1fr));gap:3px}
.orow{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:0 6px;touch-action:none;overflow:hidden;min-height:0}
.orow.empty{border-style:dashed;background:#ffffff80;color:#999;font-size:12px}
.orow em{font-style:normal;background:var(--g);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.orow small{font-size:9px;color:var(--g2);font-weight:700;min-width:48px;white-space:nowrap}
.orow b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow span{font-size:10px;color:var(--mut)}
.orow i{font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px}
.orow.cur{background:var(--blue);border-color:#0b4f8a;color:#fff}
.orow.cur small,.orow.cur span{color:#d0ebff}
.orow.cur i{background:#fff;color:var(--blue)}
.orow.nxt{background:#fff3bf;border-color:#f59f00}
.orow.nxt i{background:#f59f00;color:#fff}
.chg{outline:3px solid var(--acc);outline-offset:-1px}
.right{width:112px;flex-shrink:0;overflow-y:auto;padding:4px;border-left:1px solid var(--line);background:#ebe8dc;-webkit-overflow-scrolling:touch}
.frame,.bench{background:#fff;border:2px dashed #aaa;border-radius:8px;padding:2px 4px 4px;margin-bottom:5px;min-height:50px}
.frame h4,.bench h4{margin:0 0 3px;font-size:11px;color:var(--mut)}
.frame.ph h4{color:#c2255c}.frame.pr h4{color:#0b7285}
.bench{min-height:90px}
.mcard{background:#fff8e1;border:1.5px solid #e0c97a;border-radius:7px;padding:0 6px 0 0;margin-bottom:4px;line-height:1.2;touch-action:pan-y;display:flex;align-items:stretch}
.mcard .grip{width:26px;flex-shrink:0;display:grid;place-items:center;background:#f1dfa0;border-radius:6px 0 0 6px;color:#8a6d00;font-size:16px;touch-action:none;margin-right:5px}
.mcard .mc{padding:4px 0;min-width:0}
.mcard b{font-size:14px;display:block}
.mcard small{font-size:10px;color:var(--mut)}
.mcard u{font-size:9px;text-decoration:none;background:#868e96;color:#fff;border-radius:4px;padding:0 4px;margin-left:3px}
.over{box-shadow:0 0 0 4px var(--blue)}
.dragging{opacity:.35}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;box-shadow:0 6px 16px #0006;margin:0!important}
.bar{background:#212529;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;flex-shrink:0}
.bar span{flex:1;font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#dee2e6;color:#212529;font-size:15px}
.btn.pri{background:var(--acc);color:#fff}
.btn.g{background:var(--g2);color:#fff}
.btn.red{background:#e03131;color:#fff}
.btn.w{width:100%}
.tabs{display:flex;height:52px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;border:0;background:none;font-size:13px;color:var(--mut)}
.tabs button.on{color:var(--g);font-weight:800;box-shadow:inset 0 3px 0 var(--g)}
.pad{padding:10px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.prow .no{background:var(--g);color:#fff;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.prow .nm{flex:1;line-height:1.25}
.prow .nm small{color:var(--mut);display:block;font-size:11px}
.prow .gr{font-size:12px;color:var(--mut);text-align:right}
.prow.grad{opacity:.55}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;font-size:17px;font-weight:700}
.trow span{flex:1}.trow small{font-weight:400;color:var(--mut);font-size:12px}
.sheet{position:absolute;inset:0;background:#fffdf5;display:flex;flex-direction:column;z-index:20;-webkit-user-select:text;user-select:text}
.sheet header{background:var(--g);color:#fff;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.sheet header span{flex:1}
.sbody{flex:1;overflow:auto;padding:14px 16px}
.sbody p{font-size:25px;line-height:2.15;margin:0 0 10px;font-weight:600}
.sbody p.small{font-size:14px;line-height:1.6;color:var(--mut);font-weight:400}
ruby rt{font-size:.42em;font-weight:400;color:#555}
.sfoot{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:#fff}
.sfoot .btn{flex:1}
.form label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.form input[type=text],.form select,.form textarea{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin-top:12px}
.form .chk input{width:20px;height:20px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.note textarea{width:100%;font-size:15px;min-height:60px;border:1px solid #ccc;border-radius:6px;padding:6px}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hint{font-size:12px;color:var(--mut);padding:2px 4px}
</style>
</head>
<body>
<div id="app"><div id="root"></div><div id="toast"></div></div>
<script>
/* ===== 定数 ===== */
const POS={P:{s:'投',n:'ピッチャー'},C:{s:'捕',n:'キャッチャー'},'1B':{s:'一',n:'ファースト'},'2B':{s:'二',n:'セカンド'},'3B':{s:'三',n:'サード'},SS:{s:'遊',n:'ショート'},LF:{s:'左',n:'レフト'},CF:{s:'中',n:'センター'},RF:{s:'右',n:'ライト'}};
const POSKEYS=Object.keys(POS);
const FXY={CF:[50,12],LF:[15,30],RF:[85,30],SS:[33,52],'2B':[67,52],'3B':[13,76],'1B':[87,76],P:[50,66],C:[50,90]};
const KEY='uguisu-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== 状態 ===== */
function fiscalYear(d){d=d||new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;}
function defaultNotes(){return[
 {id:'n1',title:'試合前（整列）',text:'それでは、{自チーム}対{相手}の試合を行います。両チーム、ご整列ください。'},
 {id:'n2',title:'ファウルボール注意',text:'ファウルボールにご注意ください。'},
 {id:'n3',title:'タイム',text:'ただいま、タイムがかかりました。しばらくお待ちください。'},
 {id:'n4',title:'試合終了',text:'以上をもちまして、{自チーム}対{相手}の試合を終了いたします。ご声援ありがとうございました。'}
];}
function blank(){return{fy:fiscalYear(),players:[],teams:[],game:null,notes:defaultNotes()};}
function migrate(st){
  if(!Array.isArray(st.players))st.players=[];
  (st.teams||[]).forEach(t=>{
    if(Array.isArray(t.players)){t.members=t.members||[];t.players.forEach(p=>{if(!st.players.some(x=>x.id===p.id))st.players.push(p);if(!t.members.includes(p.id))t.members.push(p.id);});delete t.players;}
    if(!t.members)t.members=[];
  });
}
let S=blank();
try{
  const r=localStorage.getItem(KEY);
  if(r)S=Object.assign(blank(),JSON.parse(r));
  else{ // v1(叩き版)からの移行
    const o=localStorage.getItem('uguisu-v1');
    if(o){const d=JSON.parse(o);if(d.players&&d.players.length)S.teams.push({id:uid('t'),name:(d.team&&d.team.name)||'自チーム',players:d.players});if(d.notes)S.notes=d.notes;}
  }
}catch(e){}
// 毎年4/1に学年を繰り上げ
migrate(S);
(function(){if(!S.seeded){['レギュラー','ジュニア','リトル','スーパーリトル'].forEach(n=>{if(!S.teams.some(t=>t.name===n))S.teams.push({id:uid('t'),name:n,members:[]});});S.seeded=true;}})();
(function(){const now=fiscalYear();if(S.fy<now){const diff=now-S.fy;S.players.forEach(p=>{const g=parseInt(p.grade,10);if(g)p.grade=String(g+diff);});S.fy=now;}})();
if(S.game){S.game.side='my';if(!S.game.sides.my)S.game=null;}
const ui={tab:'game',teamId:null,modal:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const gl=g=>{const n=parseInt(g,10);return !n?'':n>6?'卒団':n+'年';};

/* ===== 試合・チーム ===== */
const teamOf=id=>S.teams.find(t=>t.id===id);
const G=()=>S.game;
const sdOf=k=>S.game.sides[k];
const curKey=()=>S.game.side;
const curSd=()=>sdOf(curKey());
const plist=sd=>{const t=teamOf(sd.teamId);return t?t.members.map(id=>S.players.find(p=>p.id===id)).filter(Boolean):[];};
const P=(sd,id)=>plist(sd).find(p=>p.id===id);
const tName=sd=>(teamOf(sd.teamId)||{name:'チーム'}).name;
const newSide=tid=>({teamId:tid,field:Object.fromEntries(POSKEYS.map(k=>[k,null])),ph:[],pr:[],order:Array(9).fill(null),base:null,used:[],cur:-1});
const isBatting=k=>(G().half==='top')===((k==='my')===G().myFirst);
const idxInOrder=(sd,pid)=>sd.order.findIndex(s=>s&&s.pid===pid);
const fieldPosOf=(sd,pid)=>POSKEYS.find(k=>sd.field[k]===pid)||null;
const placed=(sd,pid)=>!!fieldPosOf(sd,pid)||sd.ph.includes(pid)||sd.pr.includes(pid)||idxInOrder(sd,pid)>=0;
const isField=pos=>!!POS[pos];
const lab=pos=>POS[pos]?POS[pos].n:(pos||'');
const dispName=p=>p.full&&p.mei?p.sei+p.mei:p.sei;
function nm(p){
  if(!p)return'';
  const full=p.full&&p.mei;
  const t=full?p.sei+p.mei:p.sei,k=full?(p.seiK||'')+(p.meiK||''):(p.seiK||'');
  return (k?`<ruby>${esc(t)}<rt>${esc(k)}</rt></ruby>`:esc(t))+esc(p.hon||'くん');
}
function snapshotCommit(sd){
  sd.base=clone({field:sd.field,ph:sd.ph,pr:sd.pr,order:sd.order});
  const u=new Set(sd.used);
  POSKEYS.forEach(k=>sd.field[k]&&u.add(sd.field[k]));
  sd.ph.concat(sd.pr).forEach(x=>u.add(x));
  sd.order.forEach(s=>s&&u.add(s.pid));
  sd.used=[...u];
}
const dirty=sd=>sd.base&&JSON.stringify(sd.base)!==JSON.stringify({field:sd.field,ph:sd.ph,pr:sd.pr,order:sd.order});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600);}
function purgePlayer(id){
  S.players=S.players.filter(p=>p.id!==id);S.teams.forEach(t=>{t.members=t.members.filter(x=>x!==id);});
  if(!S.game)return;
  Object.values(S.game.sides).forEach(sd=>{
    POSKEYS.forEach(k=>{if(sd.field[k]===id)sd.field[k]=null;});
    sd.ph=sd.ph.filter(x=>x!==id);sd.pr=sd.pr.filter(x=>x!==id);
    sd.order=sd.order.map(s=>s&&s.pid===id?null:s);
    if(sd.base){POSKEYS.forEach(k=>{if(sd.base.field[k]===id)sd.base.field[k]=null;});sd.base.ph=sd.base.ph.filter(x=>x!==id);sd.base.pr=sd.base.pr.filter(x=>x!==id);sd.base.order=sd.base.order.map(s=>s&&s.pid===id?null:s);}
  });
}

/* ===== セリフ生成（名前は1回だけ読む） ===== */
const noTxt=p=>p.no?`背番号${esc(p.no)}。`:'';
function batterLine(sd,i){
  const s=sd.order[i];if(!s)return'';
  const p=P(sd,s.pid);if(!p)return'';
  const pl=lab(s.pos)?lab(s.pos)+'、':'';
  return `${i+1}番、${pl}${nm(p)}。${noTxt(p)}`;
}
function startingLines(sd){
  const L=[`${esc(tName(sd))}のスターティングメンバーをお知らせします。`];
  sd.order.forEach((s,i)=>{if(s){const p=P(sd,s.pid);if(p){const pl=lab(s.pos)?lab(s.pos)+'、':'';L.push(`${i+1}番、${pl}${nm(p)}。${noTxt(p)}`);}}});
  L.push(`以上、${esc(tName(sd))}のスターティングメンバーでした。`);
  return L;
}
function buildChanges(sd){
  const b=sd.base.order,c=sd.order,out=[];
  c.forEach((s,i)=>{
    const o=b[i];
    if(!s)return;
    if(o&&o.pid===s.pid&&o.pos===s.pos)return;
    const np=P(sd,s.pid);if(!np)return;
    const n=i+1;
    if(o&&o.pid===s.pid){
      const old=o.pos;
      if(old==='代打'||old==='代走')out.push({k:4,n,t:`先ほど${old}いたしました${nm(np)}が、そのまま${lab(s.pos)||'ベンチ'}に入ります。`});
      else if(isField(s.pos)&&isField(old))out.push({k:4,n,t:`${lab(old)}の${nm(np)}が、${lab(s.pos)}に入ります。`});
      else if(isField(s.pos))out.push({k:4,n,t:`${nm(np)}が、${lab(s.pos)}に入ります。`});
      return;
    }
    const op=o&&P(sd,o.pid);
    if(s.pos==='代打'){
      out.push({k:1,n,t:`${n}番、${op?nm(op)+'に代わりまして、':''}代打、${nm(np)}。${noTxt(np)}`});
    }else if(s.pos==='代走'){
      out.push({k:2,n,t:`${op?'ランナーの'+nm(op)+'に代わりまして、':''}代走、${nm(np)}。${noTxt(np)}`});
    }else{
      const pl=lab(s.pos);
      out.push({k:3,n,t:`${op&&o.pos?lab(o.pos)+'の':''}${op?nm(op)+'に代わりまして、':''}${nm(np)}が入り、${pl||'ベンチ'}。${noTxt(np)}`});
    }
  });
  POSKEYS.forEach(k=>{
    const pid=sd.field[k];
    if(pid&&sd.base.field[k]!==pid&&idxInOrder(sd,pid)<0&&P(sd,pid))
      out.push({k:6,n:99,t:`${lab(k)}に、${nm(P(sd,pid))}が入ります。（※打順に入っていません）`});
  });
  out.sort((a,b)=>a.k-b.k||a.n-b.n);
  return out.map(x=>x.t);
}

/* ===== 描画 ===== */
function headerHTML(){
  if(ui.tab==='game'&&S.game){
    const g=S.game;
    return `<header class="top"><button class="hb" data-act="half-prev">◀</button>
    <div class="inn">${g.inning}回${g.half==='top'?'表':'裏'}<small>${isBatting('my')?'⚾ 攻撃':'守備'}（${esc(tName(sdOf('my')))}）</small></div>
    <button class="hb" data-act="half-next">▶</button><button class="hb" data-act="menu">⋯</button></header>`;
  }
  if(ui.tab==='players'&&ui.teamId){
    const t=teamOf(ui.teamId);
    return `<header class="top"><button class="hb" data-act="team-back">◀</button><h1>${esc(ui.teamId==='ALL'?'全選手':t?t.name:'')}</h1>${ui.teamId==='ALL'?'':'<button class="hb" data-act="team-rename">名前変更</button>'}</header>`;
  }
  const t={game:'試合',players:'チーム・選手',settings:'設定・定型文'}[ui.tab];
  return `<header class="top"><h1>${t}</h1></header>`;
}
function fieldHTML(sd,live){
  return `<div class="field"><div class="dia"></div>${POSKEYS.map(k=>{
    const pid=sd.field[k],p=P(sd,pid),[x,y]=FXY[k];
    const chg=live&&sd.base&&sd.base.field[k]!==pid;
    return `<div class="fslot ${p?'':'empty'} ${chg?'chg':''}" style="left:${x}%;top:${y}%" data-drop="field:${k}" ${p?`data-pid="${p.id}" data-from="field:${k}"`:''}><span class="pl">${POS[k].s}</span><b>${p?esc(dispName(p)):'−'}</b></div>`;
  }).join('')}</div>`;
}
function orderHTML(sd,live){
  const n=sd.order.length;
  let nxt=sd.cur>=0?(sd.cur+1)%n:0;
  for(let k=0;k<n&&!sd.order[nxt];k++)nxt=(nxt+1)%n;
  return `<div class="order">${sd.order.map((s,i)=>{
    const p=s&&P(sd,s.pid);
    const o=sd.base&&sd.base.order[i];
    const chg=live&&sd.base&&JSON.stringify(o)!==JSON.stringify(s);
    if(!p)return `<div class="orow empty" data-drop="order:${i}"><em>${i+1}</em>空き</div>`;
    const cur=sd.cur===i,nx=nxt===i&&!cur;

/* ===== ドラッグ操作のロジック ===== */
function removeFrom(arr,pid){const i=arr.indexOf(pid);if(i>=0)arr.splice(i,1);}
const isLive=()=>S.game.phase==='live';
function dropToField(sd,pid,pos){
  const prev=sd.field[pos];if(prev===pid)return;
  const fp=fieldPosOf(sd,pid),inO=idxInOrder(sd,pid),pj=prev?idxInOrder(sd,prev):-1;
  removeFrom(sd.ph,pid);removeFrom(sd.pr,pid);
  if(fp){
    sd.field[fp]=prev||null;
    if(pj>=0&&prev)sd.order[pj].pos=fp;
  }else if(prev&&pj>=0){
    if(inO<0)sd.order[pj]={pid,pos};
    else sd.order[pj].pos='';
  }
  sd.field[pos]=pid;
  if(inO>=0)sd.order[inO].pos=pos;
}
function dropToOrder(sd,pid,i,from,key){
  if(from.startsWith('order:'))return; // 打順の入れ替えはできない
  const old=sd.order[i];
  let pos=fieldPosOf(sd,pid)||(sd.ph.includes(pid)?'代打':sd.pr.includes(pid)?'代走':'');
  if(from==='bench'){
    if(isLive()&&isBatting(key)){toast('代打枠か代走枠に入れてから、打順へドラッグしてください');return false;}
    pos=old?old.pos:'';
  }
  const j=idxInOrder(sd,pid);
  if(j>=0&&j!==i){
    if(isLive()){toast('打順の入れ替えはできません');return false;}
    sd.order[j]=old||null;
  }
  sd.order[i]={pid,pos};
}
function dropToFrame(sd,pid,which){
  const to=which==='ph'?sd.ph:sd.pr,other=which==='ph'?sd.pr:sd.ph;
  removeFrom(other,pid);if(!to.includes(pid))to.push(pid);
}
function dropToBench(sd,pid,from){
  if(from==='ph')removeFrom(sd.ph,pid);
  else if(from==='pr')removeFrom(sd.pr,pid);
  else if(from.startsWith('field:')){const k=from.slice(6);sd.field[k]=null;const j=idxInOrder(sd,pid);if(j>=0)sd.order[j].pos='';}
  else if(from.startsWith('order:')){
    if(isLive()){toast('試合中は打順から外せません（「編成を直す」を使ってください）');return false;}
    sd.order[+from.slice(6)]=null;
  }
}
function doDrop(pid,from,target){
  if(target===from||!S.game)return;
  const key=curKey(),sd=curSd();let r;
  if(target.startsWith('field:')){if(from.startsWith('order:')&&false)return;dropToField(sd,pid,target.slice(6));}
  else if(target.startsWith('order:'))r=dropToOrder(sd,pid,+target.slice(6),from,key);
  else if(target==='ph'||target==='pr')dropToFrame(sd,pid,target);
  else if(target==='bench')r=dropToBench(sd,pid,from);
  if(r===false)return;
  save();render();
}
function showLines(title,lines){ui.modal={type:'lines',title,lines};render();}
function openBatter(i){const k=curKey();sdOf(k).cur=i;save();ui.modal={type:'batter',i,key:k,intro:false};render();}
function nextBatter(sd,i,d){
  const n=sd.order.length;
  for(let k=1;k<=n;k++){const j=((i+d*k)%n+n)%n;if(sd.order[j]&&P(sd,sd.order[j].pid))return j;}
  return i;
}
function fillNote(t){
  const my=S.game?tName(sdOf('my')):'自チーム',op=(S.game&&S.game.oppName)||'相手チーム';
  return esc(t).replace(/\{自チーム\}/g,esc(my)).replace(/\{相手\}/g,esc(op));
}
function bothStarting(){return startingLines(sdOf('my'));}
function setBattingSide(){S.game.side='my';}

function act(a){
  const [k,arg]=a.split(/:(.*)/);
  switch(k){
    case 'tab':ui.tab=arg;render();break;
    case 'side':S.game.side=arg;save();render();break;
    case 'game-new':{
      const my=$('#g-my').value,opp=$('#g-opp').value.trim();
      S.game={myId:my,oppName:opp,myFirst:$('#g-first').value==='1',inning:1,half:'top',phase:'setup',started:false,side:'my',sides:{my:newSide(my)},last:null};
      save();render();break;}
    case 'half-next':{const g=S.game;if(g.half==='top')g.half='bottom';else{g.half='top';g.inning++;}setBattingSide();save();render();break;}
    case 'half-prev':{const g=S.game;if(g.half==='bottom')g.half='top';else if(g.inning>1){g.half='bottom';g.inning--;}setBattingSide();save();render();break;}
    case 'close':ui.modal=null;render();break;
    case 'menu':ui.modal={type:'menu'};render();break;
    case 'notes':ui.modal={type:'notes'};render();break;
    case 'note':{const n=S.notes.find(x=>x.id===arg);if(n)showLines(n.title,[fillNote(n.text)]);break;}
    case 'intro':ui.modal.intro=!ui.modal.intro;render();break;
    case 'bnav':{const sd=sdOf(ui.modal.key),j=nextBatter(sd,ui.modal.i,+arg);sd.cur=j;save();ui.modal.i=j;render();break;}
    case 'start':{
      const g=S.game;
      if(!g.started){g.started=true;g.phase='live';snapshotCommit(sdOf('my'));const L=bothStarting();g.last={title:'スタメン発表',lines:L};setBattingSide();save();showLines('スタメン発表',L);}
      else{g.phase='live';snapshotCommit(sdOf('my'));save();render();}
      break;}
    case 'undo':{const sd=curSd();sd.field=clone(sd.base.field);sd.ph=clone(sd.base.ph);sd.pr=clone(sd.base.pr);sd.order=clone(sd.base.order);save();render();break;}
    case 'done':{
      const sd=curSd(),L=buildChanges(sd);
      snapshotCommit(sd);
      if(!L.length){save();render();toast('セリフなし（枠の移動のみ）');break;}
      const lines=[`${esc(tName(sd))}、選手の交代をお知らせします。`,...L,'以上の交代です。'];
      S.game.last={title:'選手交代',lines};save();showLines('選手交代',lines);break;}
    case 'm-edit':S.game.phase='setup';ui.modal=null;save();render();break;
    case 'm-start':showLines('スタメン発表',bothStarting());break;
    case 'm-last':if(S.game.last)showLines(S.game.last.title,S.game.last.lines);else toast('まだありません');break;
    case 'm-new':
      if(confirm('この試合の編成と進行を終了します（チーム・選手の登録は残ります）。よろしいですか？')){S.game=null;ui.modal=null;save();render();}
      break;
    case 'team-add':ui.modal={type:'team',id:null};render();break;
    case 'team-rename':ui.modal={type:'team',id:ui.teamId};render();break;
    case 'team-save':{
      const v=$('#f-tname').value.trim();if(!v){toast('チーム名を入力してください');break;}
      if(ui.modal.id)teamOf(ui.modal.id).name=v;else S.teams.push({id:uid('t'),name:v,members:[]});
      ui.modal=null;save();render();break;}
    case 'team-open':ui.teamId=arg;render();break;
    case 'team-back':ui.teamId=null;render();break;
    case 'team-del':
      if(confirm('このチームを削除します（選手の登録は「全選手」に残ります）。よろしいですか？')){
        if(S.game&&(S.game.myId===ui.teamId))S.game=null;
        S.teams=S.teams.filter(t=>t.id!==ui.teamId);ui.teamId=null;save();render();
      }break;
    case 'team-pick':ui.modal={type:'pick'};render();break;
    case 'pick-save':{const t=teamOf(ui.teamId);document.querySelectorAll('.pk:checked').forEach(x=>{if(!t.members.includes(x.value))t.members.push(x.value);});ui.modal=null;save();render();break;}
    case 'player-add':ui.modal={type:'player',pid:null};render();break;
    case 'player-edit':ui.modal={type:'player',pid:arg};render();break;
    case 'player-save':{
      const v=id=>$('#'+id).value.trim();
      if(!v('f-sei')){toast('苗字を入力してください');break;}
      const d={sei:v('f-sei'),seiK:v('f-seiK'),mei:v('f-mei'),meiK:v('f-meiK'),grade:v('f-grade'),no:v('f-no'),hon:$('#f-hon').value,full:$('#f-full').checked};
      let pl;
      if(ui.modal.pid){pl=S.players.find(p=>p.id===ui.modal.pid);Object.assign(pl,d);}
      else{pl=Object.assign({id:uid('p')},d);S.players.push(pl);}
      const chosen=[...document.querySelectorAll('.tm:checked')].map(x=>x.value);
      S.teams.forEach(t=>{const has=t.members.includes(pl.id),want=chosen.includes(t.id);if(want&&!has)t.members.push(pl.id);else if(!want&&has)t.members=t.members.filter(x=>x!==pl.id);});
      ui.modal=null;save();render();break;}
    case 'player-del':{
      const id=ui.modal.pid;
      if(confirm('この選手を削除しますか？')){purgePlayer(id);ui.modal=null;save();render();}
      break;}
    case 'sample':{
      const t=teamOf(ui.teamId);
      const S0=[['山田','やまだ','太郎','たろう',6,10],['佐藤','さとう','健太','けんた',6,2],['鈴木','すずき','翔','しょう',6,3],['高橋','たかはし','大輝','だいき',5,4],['田中','たなか','蓮','れん',5,5],['伊藤','いとう','陽太','ようた',5,6],['渡辺','わたなべ','颯','はやて',4,7],['中村','なかむら','美咲','みさき',4,8,'さん'],['小林','こばやし','悠斗','ゆうと',4,9],['加藤','かとう','樹','いつき',4,11],['吉田','よしだ','陸','りく',3,12],['山本','やまもと','拓海','たくみ',3,13]];
      S0.forEach(r=>{const p={id:uid('s'),sei:r[0],seiK:r[1],mei:r[2],meiK:r[3],grade:String(r[4]),no:String(r[5]),hon:r[6]||'くん',full:false};S.players.push(p);if(t)t.members.push(p.id);});
      save();render();break;}
    case 'note-add':S.notes.push({id:uid('n'),title:'新しい案内',text:''});save();render();break;
    case 'note-del':S.notes=S.notes.filter(n=>n.id!==arg);save();render();break;
    case 'export':$('#s-bk').value=JSON.stringify({players:S.players,teams:S.teams,notes:S.notes,fy:S.fy});break;
    case 'import':{
      try{const d=JSON.parse($('#s-bk').value);if(!Array.isArray(d.teams))throw 0;
        if(confirm('チーム・選手・案内文を上書きします。よろしいですか？')){
          S.teams=d.teams;S.players=Array.isArray(d.players)?d.players:[];migrate(S);if(d.notes)S.notes=d.notes;if(d.fy)S.fy=d.fy;S.game=null;ui.teamId=null;
          save();render();toast('読み込みました');}
      }catch(e){toast('データの形式が正しくありません');}
      break;}
  }
}
function tap(t){
  const [k,arg]=t.split(':');
  if(k==='batter')openBatter(+arg);
}

/* ===== イベント ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a)act(a.dataset.act);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='g-my')ui.pickMy=t.value;
  else if(t.dataset&&t.dataset.nt){const n=S.notes.find(x=>x.id===t.dataset.nt);if(n){n.title=t.value;save();}}
  else if(t.dataset&&t.dataset.nx){const n=S.notes.find(x=>x.id===t.dataset.nx);if(n){n.text=t.value;save();}}
});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-pid]'))e.preventDefault();});

/* ドラッグ＆ドロップ
   右のベンチ欄は縦スクロール優先：横に動かす or 長押しでドラッグ開始 */
let drag=null,overEl=null;
function targetAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('[data-drop]'):null;}
function beginDrag(x,y){
  const d=drag;if(!d||d.started)return;
  d.started=true;clearTimeout(d.timer);
  const r=d.el.getBoundingClientRect();
  const g=d.el.cloneNode(true);
  g.classList.add('ghost');g.removeAttribute('data-drop');g.style.width=r.width+'px';g.style.height=r.height+'px';
  document.body.appendChild(g);d.ghost=g;d.w=r.width;d.h=r.height;
  d.el.classList.add('dragging');
  moveGhost(x,y);
}
function moveGhost(x,y){
  const d=drag;
  d.ghost.style.left=(x-d.w/2)+'px';d.ghost.style.top=(y-d.h/2-24)+'px';
  const t=targetAt(x,y);
  if(overEl&&overEl!==t)overEl.classList.remove('over');
  overEl=t;if(t&&t!==d.el)t.classList.add('over');
}
document.addEventListener('pointerdown',e=>{
  if(ui.modal||(e.pointerType==='mouse'&&e.button!==0))return;
  const el=e.target.closest('[data-pid]');if(!el)return;
  drag={pid:el.dataset.pid,from:el.dataset.from,tap:el.dataset.tap,el,started:false,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId,
        scrolly:e.pointerType!=='mouse'&&!!el.closest('.right')&&!e.target.closest('.grip')};
  if(drag.scrolly)drag.timer=setTimeout(()=>{if(drag&&!drag.started)beginDrag(drag.x,drag.y);},220);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.started){
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(drag.scrolly){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){clearTimeout(drag.timer);drag=null;return;}  // 縦スクロール
      if(Math.abs(dx)>10)beginDrag(e.clientX,e.clientY);
    }else if(Math.hypot(dx,dy)>5)beginDrag(e.clientX,e.clientY);
    return;
  }
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(drag&&drag.started)e.preventDefault();},{passive:false});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;clearTimeout(d.timer);
  if(overEl){overEl.classList.remove('over');overEl=null;}
  if(d.started){
    d.ghost.remove();d.el.classList.remove('dragging');
    if(!cancel){const t=targetAt(e.clientX,e.clientY);if(t)doDrop(d.pid,d.from,t.dataset.drop);}
  }else if(!cancel&&d.tap){tap(d.tap);}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
