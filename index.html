<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ウグイスアシスト</title>
<style>
:root{--g:#14532d;--g2:#1f7a45;--bg:#f3f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--acc:#e8590c;--blue:#1971c2;--line:#d8d4c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#222;font-family:system-ui,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit}
#app{max-width:480px;height:var(--app-h,100dvh);margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
#root{display:flex;flex-direction:column;height:100%}
header.top{background:var(--g);color:#fff;display:flex;align-items:center;gap:6px;padding:5px 8px;min-height:46px;flex-shrink:0}
header.top h1{font-size:16px;margin:0;flex:1}
header.top .inn{flex:1;text-align:center;font-weight:700;font-size:16px;line-height:1.2}
header.top .inn small{display:block;font-weight:400;font-size:11px;opacity:.9}
.hb{background:#ffffff26;border:0;color:#fff;border-radius:8px;min-width:40px;height:36px;font-size:15px;padding:0 8px}
.view{flex:1;overflow:auto;min-height:0}
.view.gv{overflow:hidden;display:flex;flex-direction:column}
.sidetabs{display:flex;gap:4px;padding:4px 4px 0;flex-shrink:0}
.sidetabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:8px;padding:5px 2px;font-size:13px;font-weight:700;color:var(--mut);line-height:1.2}
.sidetabs button small{display:block;font-weight:400;font-size:10px}
.sidetabs button.on{border-color:var(--g);background:#e6f4ea;color:var(--g)}
.game{flex:1;min-height:0;display:flex}
.left{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px}
.field{position:relative;flex:0 0 33%;background:#cfe8c3;border-radius:10px;overflow:hidden}
.dia{position:absolute;left:50%;top:62%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#d9b77e88;border:2px solid #ffffffaa}
.fslot{position:absolute;transform:translate(-50%,-50%);width:62px;height:34px;background:#fff;border:2px solid var(--line);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;line-height:1.1;overflow:hidden}
.fslot .pl{font-size:9px;color:var(--g2);font-weight:700}
.fslot b{font-size:12px;white-space:nowrap}
.fslot.empty{background:#ffffff80;border-style:dashed}
.fbtn{position:absolute;bottom:3px;background:#fff;border:2px solid var(--g2);color:var(--g);border-radius:8px;height:28px;padding:0 10px;font-weight:700;font-size:13px}
.fbtn.l{left:3px}.fbtn.r{right:3px;border-color:#868e96;color:#495057}
.lower{flex:1;min-height:0;display:flex;gap:4px;margin-top:4px}
.notecol{width:76px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.notecol button{margin:0;border:2px solid var(--g2);background:#fff;color:var(--g);border-radius:8px;font-size:11px;font-weight:700;line-height:1.25;padding:4px 2px;word-break:break-all;min-height:38px}
.order{flex:1;min-width:0;min-height:0;display:grid;grid-template-rows:repeat(9,minmax(0,1fr));gap:3px}
.orow{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:0 6px;touch-action:none;overflow:hidden;min-height:0}
.orow.empty{border-style:dashed;background:#ffffff80;color:#999;font-size:12px}
.orow em{font-style:normal;background:var(--g);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.orow small{font-size:9px;color:var(--g2);font-weight:700;min-width:36px;white-space:nowrap}
.orow b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow span{font-size:10px;color:var(--mut)}
.orow i{font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px}
.orow.cur{background:var(--blue);border-color:#0b4f8a;color:#fff}
.orow.cur small,.orow.cur span{color:#d0ebff}
.orow.cur i{background:#fff;color:var(--blue)}
.orow.nxt{background:#fff3bf;border-color:#f59f00}
.orow.nxt i{background:#f59f00;color:#fff}
.chg{outline:3px solid var(--acc);outline-offset:-1px}
.right{width:112px;flex-shrink:0;overflow-y:auto;padding:4px;border-left:1px solid var(--line);background:#ebe8dc;-webkit-overflow-scrolling:touch}
.frame,.bench{background:#fff;border:2px dashed #aaa;border-radius:8px;padding:2px 4px 4px;margin-bottom:5px;min-height:50px}
.frame h4,.bench h4{margin:0 0 3px;font-size:11px;color:var(--mut)}
.frame.ph h4{color:#c2255c}.frame.pr h4{color:#0b7285}
.bench{min-height:90px}
.mcard{background:#fff8e1;border:1.5px solid #e0c97a;border-radius:7px;padding:0 6px 0 0;margin-bottom:4px;line-height:1.2;touch-action:pan-y;display:flex;align-items:stretch}
.mcard .grip{width:26px;flex-shrink:0;display:grid;place-items:center;background:#f1dfa0;border-radius:6px 0 0 6px;color:#8a6d00;font-size:16px;touch-action:none;margin-right:5px}
.mcard .mc{padding:4px 0;min-width:0}
.mcard b{font-size:14px;display:block}
.mcard small{font-size:10px;color:var(--mut)}
.mcard u{font-size:9px;text-decoration:none;background:#868e96;color:#fff;border-radius:4px;padding:0 4px;margin-left:3px}
.over{box-shadow:0 0 0 4px var(--blue)}
.dragging{opacity:.35}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;box-shadow:0 6px 16px #0006;margin:0!important}
.bar{background:#212529;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;flex-shrink:0}
.bar span{flex:1;font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#dee2e6;color:#212529;font-size:15px}
.btn.pri{background:var(--acc);color:#fff}
.btn.g{background:var(--g2);color:#fff}
.btn.red{background:#e03131;color:#fff}
.btn.w{width:100%}
.tabs{display:flex;height:52px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;border:0;background:none;font-size:13px;color:var(--mut)}
.tabs button.on{color:var(--g);font-weight:800;box-shadow:inset 0 3px 0 var(--g)}
.pad{padding:10px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.prow .no{background:var(--g);color:#fff;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.prow .nm{flex:1;line-height:1.25}
.prow .nm small{color:var(--mut);display:block;font-size:11px}
.prow .gr{font-size:12px;color:var(--mut);text-align:right}
.prow.grad{opacity:.55}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;font-size:17px;font-weight:700}
.trow span{flex:1}.trow small{font-weight:400;color:var(--mut);font-size:12px}
.sheet{position:absolute;inset:0;background:#fffdf5;display:flex;flex-direction:column;z-index:20;-webkit-user-select:text;user-select:text}
.sheet header{background:var(--g);color:#fff;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.sheet header span{flex:1}
.sbody{flex:1;overflow:auto;padding:14px 16px}
.sbody p{font-size:25px;line-height:2.15;margin:0 0 10px;font-weight:600}
.sbody p.small{font-size:14px;line-height:1.6;color:var(--mut);font-weight:400}
ruby rt{font-size:.42em;font-weight:400;color:#555}
.sfoot{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:#fff}
.sfoot .btn{flex:1}
.form label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.form input[type=text],.form select,.form textarea{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin-top:12px}
.form .chk input{width:20px;height:20px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.note textarea{width:100%;font-size:15px;min-height:60px;border:1px solid #ccc;border-radius:6px;padding:6px}
input,textarea,select{-webkit-user-select:text;user-select:text}
.var{font:inherit;font-size:.8em;border:0;border-bottom:2px solid var(--acc);background:#fff3bf;text-align:center;border-radius:4px;padding:0 2px;min-width:3em;color:var(--ink)}
.vsel{font:inherit;font-size:.8em;border:2px solid var(--acc);border-radius:6px;background:#fff3bf;color:var(--ink)}
.aside{font-size:14px;color:var(--mut);font-weight:400}
.btn.big{padding:14px;margin-bottom:6px;font-size:16px;text-align:left}
.btn.ph{background:#c2255c;color:#fff}.btn.pr{background:#0b7285;color:#fff}
.descbox{background:#e7f5ff;border-left:4px solid var(--blue);padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.6;color:#0b4f8a;font-weight:400;margin-bottom:12px}
.sbody.help p{font-size:16px;font-weight:400;line-height:1.7}
.submode{display:flex;gap:4px;margin-bottom:6px}
.smb{flex:1;border:2px solid #868e96;background:#fff;color:#495057;border-radius:8px;padding:10px 0;font-size:15px;font-weight:800}
.smb.ph.on{background:#c2255c;border-color:#c2255c;color:#fff}
.smb.pr.on{background:#0b7285;border-color:#0b7285;color:#fff}
.btn[disabled]{opacity:.4}
.mk{font-style:normal;text-decoration:none;font-size:11px;font-weight:800;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;flex-shrink:0}
.mk.ph{background:#c2255c}.mk.pr{background:#0b7285}
.clubbox{background:#fff;border:2px solid var(--g2);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.clubrow{display:flex;align-items:center;gap:8px}
.clubrow b{flex:1;font-size:18px}
.clubrow .btn{padding:8px 16px}
.fslot.sub{background:#fff4e6;border-color:#f08c00}
.sx{position:absolute;top:-2px;right:-2px;background:#f08c00;color:#fff;font-style:normal;text-decoration:none;font-size:10px;font-weight:800;border-radius:0 5px 0 6px;padding:0 4px;line-height:14px}
.mk.sb{background:#f08c00}
.bench.gone{background:#f1f3f5;border-color:#ced4da;min-height:0}
.bench.gone .mcard{opacity:.7;background:#e9ecef;border-color:#ced4da}
.mvb{border:0;background:#dee2e6;border-radius:8px;width:46px;height:40px;font-size:16px;flex-shrink:0}
.notecol .endb{border-color:#e03131;color:#e03131;margin-top:6px}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hint{font-size:12px;color:var(--mut);padding:2px 4px}
</style>
</head>
<body>
<div id="app"><div id="root"></div><div id="toast"></div></div>
<script>
/* 画面の実際の高さに合わせる（ヘッダー・フッターが隠れないように） */
function setAppH(){
  const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');
}
setAppH();
window.addEventListener('resize',setAppH);
window.addEventListener('orientationchange',()=>setTimeout(setAppH,150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',setAppH);
/* ===== 定数 ===== */
const POS={P:{s:'投',n:'ピッチャー'},C:{s:'捕',n:'キャッチャー'},'1B':{s:'一',n:'ファースト'},'2B':{s:'二',n:'セカンド'},'3B':{s:'三',n:'サード'},SS:{s:'遊',n:'ショート'},LF:{s:'左',n:'レフト'},CF:{s:'中',n:'センター'},RF:{s:'右',n:'ライト'}};
const POSKEYS=Object.keys(POS);
const FXY={CF:[50,12],LF:[15,30],RF:[85,30],SS:[33,52],'2B':[67,52],'3B':[13,76],'1B':[87,76],P:[50,66],C:[50,90]};
const KEY='uguisu-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== 状態 ===== */
function fiscalYear(d){d=d||new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;}
function defaultNotes(){return[
 {id:'n_line',title:'スタメン発表',kind:'lineup',text:'',desc:'試合開始の10分前ごろに読みます。両チームの先発メンバーを、先攻・後攻の順に紹介します。相手チームはメンバー表を見て読み上げます。'},
 {id:'n_pre',title:'試合前の紹介（前置き）',hidden:true,text:'本日の第{試合番号}試合、{先攻チーム}対{後攻チーム}の試合開始に先立ちまして、両チームのスターティングラインアップならびにアンパイアをご紹介いたします。',desc:''},
 {id:'n_ump',title:'審判の紹介',text:'なお、この試合の審判は、球審{球審}、1塁{一塁審}、2塁{二塁審}、3塁{三塁審}、以上4氏でございます。\n試合開始まで今しばらくお待ちください。',desc:'先発メンバーの発表のあとに読みます。審判には「さん」付けはしなくてよいです。審判の名前は黄色い欄に入力します。'},
 {id:'n_start',title:'試合開始',text:'只今より本日の第{試合番号}試合、{先攻チーム}対{後攻チーム}の試合を開始します。',desc:'両チームが整列し、挨拶をしたあとに放送します。'},
 {id:'n_def',title:'守備位置の紹介',kind:'defense',text:'',desc:'後攻チームが先に守るとき、試合開始の放送のあとに読みます。守備につく選手を、守備位置の順に紹介します。'},
 {id:'n_water',title:'審判の給水',text:'お茶の準備ができましたので、審判員の方はお集まりください。',desc:'どのイニングの終了時に行うか、先に本部の人に確認しておき、そのイニングの終了時に放送します。'},
 {id:'n_call',title:'次試合の呼び出し',text:'本日の第{次の試合番号}試合、{次の対戦チーム1}と{次の対戦チーム2}のキャプテン及び監督は、今すぐメンバー表を持って本部席へお越しください。',desc:'4回裏が終わると同時に放送します。次の試合に出る2チームのキャプテンと監督を呼び出します。'},
 {id:'n_end',title:'試合終了',text:'只今の試合は、{自得点}対{相手得点}で{勝利チーム}の勝利となりました。\n尚、試合終了時刻は、{現在時}時{現在分}分です。ご声援ありがとうございました。\n恐れ入りますが、両チームによりますグラウンド整備をお願い致します。\n本日の第{次の試合番号}試合は、{次の開始時}時{次の開始分}分に開始予定です。試合開始まで、今しばらくお待ちください。',desc:'両チームが整列し、挨拶をしたあとに放送します。得点・終了時刻・次の試合の開始予定を伝えます。'}
];}
function upgradeNotes(){
  if(S.notesV>=4)return;
  const def=defaultNotes();
  if(!S.notes||!S.notes.length||(S.notesV||0)<3)S.notes=def;
  else def.forEach(d=>{
    const ex=S.notes.find(n=>n.id===d.id);
    if(!ex)S.notes.push(d);
    else{if(ex.desc==null)ex.desc=d.desc;if(ex.title==='次の試合の呼び出し')ex.title=d.title;}
  });
  S.notesV=4;
}
function blank(){return{fy:fiscalYear(),players:[],teams:[],game:null,notes:defaultNotes(),notesV:4,phr:{},club:''};}
function migrate(st){
  if(!Array.isArray(st.players))st.players=[];
  (st.teams||[]).forEach(t=>{
    if(Array.isArray(t.players)){t.members=t.members||[];t.players.forEach(p=>{if(!st.players.some(x=>x.id===p.id))st.players.push(p);if(!t.members.includes(p.id))t.members.push(p.id);});delete t.players;}
    if(!t.members)t.members=[];
    t.members=[...new Set(t.members)];
  });
}
let S=blank();
try{
  const r=localStorage.getItem(KEY);
  if(r){const d0=JSON.parse(r);S=Object.assign(blank(),d0);S.notesV=d0.notesV||0;}
  else{ // v1(叩き版)からの移行
    const o=localStorage.getItem('uguisu-v1');
    if(o){const d=JSON.parse(o);if(d.players&&d.players.length)S.teams.push({id:uid('t'),name:(d.team&&d.team.name)||'自チーム',players:d.players});if(d.notes)S.notes=d.notes;}
  }
}catch(e){}
// 毎年4/1に学年を繰り上げ
migrate(S);
upgradeNotes();
if(!S.phr)S.phr={};
(function(){if(!S.seeded){['レギュラー','ジュニア','リトル','スーパーリトル'].forEach(n=>{if(!S.teams.some(t=>t.name===n))S.teams.push({id:uid('t'),name:n,members:[]});});S.seeded=true;}})();
(function(){const now=fiscalYear();if(S.fy<now){const diff=now-S.fy;S.players.forEach(p=>{const g=parseInt(p.grade,10);if(g)p.grade=String(g+diff);});S.fy=now;}})();
if(S.game){S.game.side='my';if(!S.game.sides.my)S.game=null;}
const ui={tab:'game',teamId:null,modal:null,ret:null,sub:null,reorder:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const gl=g=>{const n=parseInt(g,10);return !n?'':n>6?'卒団':n+'年';};

/* ===== 試合・チーム ===== */
const teamOf=id=>S.teams.find(t=>t.id===id);
const G=()=>S.game;
const sdOf=k=>S.game.sides[k];
const curKey=()=>S.game.side;
const curSd=()=>sdOf(curKey());
const plist=sd=>{const t=teamOf(sd.teamId);return t?t.members.map(id=>S.players.find(p=>p.id===id)).filter(Boolean):[];};
const P=(sd,id)=>plist(sd).find(p=>p.id===id);
const tName=sd=>(teamOf(sd.teamId)||{name:'チーム'}).name;
const aName=sd=>{const t=teamOf(sd.teamId);return S.club||(t?(t.announce||t.name):'チーム');};
const newSide=tid=>({teamId:tid,field:Object.fromEntries(POSKEYS.map(k=>[k,null])),ph:[],pr:[],order:Array(9).fill(null),base:null,used:[],cur:-1,attend:((teamOf(tid)||{members:[]}).members.filter(id=>{const p=S.players.find(x=>x.id===id);return p&&!(parseInt(p.grade,10)>6);})),noSpoken:[]});
const isBatting=k=>(G().half==='top')===((k==='my')===G().myFirst);
const idxInOrder=(sd,pid)=>sd.order.findIndex(s=>s&&s.pid===pid);
const fieldPosOf=(sd,pid)=>POSKEYS.find(k=>sd.field[k]===pid)||null;
const placed=(sd,pid)=>!!fieldPosOf(sd,pid)||sd.ph.includes(pid)||sd.pr.includes(pid)||idxInOrder(sd,pid)>=0;
const isField=pos=>!!POS[pos];
const lab=pos=>POS[pos]?POS[pos].n:(pos||'');
const dispName=p=>p.full&&p.mei?p.sei+p.mei:p.sei;
function nm(p){
  if(!p)return'';
  const full=p.full&&p.mei;
  const t=full?p.sei+p.mei:p.sei,k=full?(p.seiK||'')+(p.meiK||''):(p.seiK||'');
  return (k?`<ruby>${esc(t)}<rt>${esc(k)}</rt></ruby>`:esc(t))+esc(p.hon||'くん');
}
function snapshotCommit(sd){
  sd.base=clone({field:sd.field,ph:sd.ph,pr:sd.pr,order:sd.order});
  const u=new Set(sd.used);
  POSKEYS.forEach(k=>sd.field[k]&&u.add(sd.field[k]));
  sd.ph.concat(sd.pr).forEach(x=>u.add(x));
  sd.order.forEach(s=>s&&u.add(s.pid));
  sd.used=[...u];
}
// 打順から外れた（代打・代走・交代で替わられた）が、まだ守備位置にいる選手
const isOut=(sd,pid)=>!!sd.base&&sd.used.includes(pid)&&idxInOrder(sd,pid)<0;
const isSub=(sd,pid)=>{
  if(sd.subs&&sd.subs.includes(pid))return true;
  if(sd.starters&&!sd.starters.includes(pid))return true;
  if(sd.base){ // 「完了」前に入れた選手（まだ打順に確定していない）
    const inBase=sd.base.order.some(x=>x&&x.pid===pid)||POSKEYS.some(k=>sd.base.field[k]===pid);
    if(!inBase)return true;
  }
  return false;
};
function recordSubs(sd){
  if(!sd.base)return;
  sd.subs=sd.subs||[];
  const bo=new Set(sd.base.order.filter(Boolean).map(x=>x.pid));
  POSKEYS.forEach(k=>{if(sd.base.field[k])bo.add(sd.base.field[k]);});
  const add=pid=>{if(pid&&!bo.has(pid)&&!sd.subs.includes(pid))sd.subs.push(pid);};
  sd.order.forEach(x=>x&&add(x.pid));
  POSKEYS.forEach(k=>add(sd.field[k]));
}
const dirty=sd=>sd.base&&JSON.stringify(sd.base)!==JSON.stringify({field:sd.field,ph:sd.ph,pr:sd.pr,order:sd.order});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600);}
function purgePlayer(id){
  S.players=S.players.filter(p=>p.id!==id);S.teams.forEach(t=>{t.members=t.members.filter(x=>x!==id);});
  if(!S.game)return;
  Object.values(S.game.sides).forEach(sd=>{
    POSKEYS.forEach(k=>{if(sd.field[k]===id)sd.field[k]=null;});
    sd.ph=sd.ph.filter(x=>x!==id);sd.pr=sd.pr.filter(x=>x!==id);
    sd.order=sd.order.map(s=>s&&s.pid===id?null:s);
    if(sd.base){POSKEYS.forEach(k=>{if(sd.base.field[k]===id)sd.base.field[k]=null;});sd.base.ph=sd.base.ph.filter(x=>x!==id);sd.base.pr=sd.base.pr.filter(x=>x!==id);sd.base.order=sd.base.order.map(s=>s&&s.pid===id?null:s);}
  });
}

/* ===== セリフ生成（放送マニュアル準拠。言い回しは設定で編集可） ===== */
const PHR_DEF={
 lineup:{l:'先発メンバー発表（1人分）',t:'{打順}番、{守備位置}、{名前}。{背番号}'},
 batter:{l:'打者紹介（背番号は打順が一巡するまで）',t:'{打順}番、{守備位置}、{名前}。{背番号}'},
 inning:{l:'攻撃開始（回の頭出し）',t:'{回}回の{表裏}、{自チーム}の攻撃は、'},
 subHead:{l:'選手交代の前置き',t:'{自チーム}、選手の交代をお知らせします。'},
 pinchHit:{l:'代打の場合',t:'{打順}番、{旧名前}に代わりまして、バッター{名前}、{背番号}'},
 pinchRun:{l:'代走の場合',t:'{塁}ランナー{旧名前}に代わりまして、{名前}、{背番号}'},
 defSub:{l:'守備交代の場合',t:'{旧守備位置}の{旧名前}に代わりまして、{名前}、{背番号}'},
 afterPinch:{l:'代打・代走後のポジション変更（別の選手が入る）',t:'先程{代打走}いたしました{旧名前}に代わりまして、{名前}が{守備位置}に入ります。{打順}番、{守備位置}、{名前}。'},
 stay:{l:'代打・代走の選手がそのまま守備につく（※マニュアルにない場合の文）',t:'先程{代打走}いたしました{名前}が、そのまま{守備位置}に入ります。'},
 multiHead:{l:'複数の守備変更：前置き',t:'{自チーム}、守備の変更をお知らせします。'},
 multiItem:{l:'複数の守備変更：1人分',t:'{旧守備位置}の{名前}が{守備位置}、'},
 multiFoot:{l:'複数の守備変更：結び',t:'以上に代わります。'}
};
const phr=k=>(S.phr&&S.phr[k]!=null?S.phr[k]:PHR_DEF[k].t);
const clean=(h,noNo)=>{h=h.replace(/、{2,}/g,'、').replace(/、。/g,'。').replace(/^、/,'');return noNo?h.replace(/、$/,'。'):h;};
const noTok=p=>p.no?`背番号${esc(p.no)}。`:'';
function varInput(k){
  const g=S.game||{},v=g.vars||{};
  const own=g.sides?aName(g.sides.my):'自チーム',opp=v['相手']||'相手チーム';
  if(k==='自チーム')return esc(own);
  if(k==='回')return String(g.inning||1);
  if(k==='表裏')return g.half==='bottom'?'裏':'表';
  if(k==='先攻チーム')return esc(g.myFirst===false?opp:own);
  if(k==='後攻チーム')return esc(g.myFirst===false?own:opp);
  let val=v[k];
  if(val==null){
    const d=new Date();
    if(k==='現在時')val=String(d.getHours());
    else if(k==='現在分')val=String(d.getMinutes()).padStart(2,'0');
    else val='';
  }
  return `<input class="var" data-var="${esc(k)}" value="${esc(val)}" placeholder="${esc(k)}" size="${Math.max(3,String(val).length+1)}">`;
}
function fill(tpl,ctx){
  return clean(esc(tpl).replace(/\{([^{}]+)\}/g,(m,k)=>(k in ctx)?ctx[k]:varInput(k)),('背番号' in ctx)&&ctx['背番号']==='');
}
function baseSel(pid){
  const v=(S.game.vars['塁:'+pid])||'';
  return `<select class="vsel" data-var="塁:${esc(pid)}"><option value="">（塁）</option>${['1塁','2塁','3塁'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
}
function batterLine(sd,i,withNo){
  const s=sd.order[i],p=s&&P(sd,s.pid);if(!p)return'';
  return fill(phr('batter'),{打順:i+1,名前:nm(p),守備位置:esc(lab(s.pos)),背番号:withNo?noTok(p):''});
}
function lineupBlock(sd){
  const L=[];
  sd.order.forEach((s,i)=>{const p=s&&P(sd,s.pid);if(p)L.push(fill(phr('lineup'),{打順:i+1,名前:nm(p),守備位置:esc(lab(s.pos)),背番号:noTok(p)}));});
  return L;
}
function noteLines(n){return String(n.text||'').split('\n').filter(x=>x.trim()).map(t=>fill(t,{}));}
function noteById(id){const n=S.notes.find(x=>x.id===id);return n?noteLines(n):[];}
function lineupLines(){
  const g=S.game,sd=sdOf('my'),own=esc(aName(sd)),opp=esc(g.vars['相手']||'相手チーム');
  const mine=[`${g.myFirst?'先攻':'後攻'}、${own}。`,...lineupBlock(sd)];
  const theirs=[`${g.myFirst?'後攻':'先攻'}、${opp}。`,`<span class="aside">（${opp}のメンバー表を見て読み上げてください）</span>`];
  return [...noteById('n_pre'),...(g.myFirst?[...mine,...theirs]:[...theirs,...mine]),...noteById('n_ump')];
}
function defenseLines(){
  const sd=sdOf('my');
  const L=[`まず守ります${esc(aName(sd))}の守備位置を紹介します。`];
  POSKEYS.forEach(k=>{const p=P(sd,sd.field[k]);if(p)L.push(`${POS[k].n}、${nm(p)}。`);});
  return [...L,...noteById('n_ump')];
}
function noteToLines(n){
  if(n.kind==='lineup')return lineupLines();
  if(n.kind==='defense')return defenseLines();
  return noteLines(n);
}
function buildChanges(sd){
  const b=sd.base.order,c=sd.order,items=[],moves=[];
  c.forEach((s,i)=>{
    const o=b[i];if(!s)return;
    if(o&&o.pid===s.pid&&o.pos===s.pos)return;
    const np=P(sd,s.pid);if(!np)return;
    const n=i+1,op=o&&P(sd,o.pid);
    const base={打順:n,名前:nm(np),背番号:noTok(np),守備位置:esc(lab(s.pos)||'ベンチ')};
    if(o&&o.pid===s.pid){
      if(o.pos==='代打'||o.pos==='代走')items.push({k:4,n,t:fill(phr('stay'),Object.assign({},base,{代打走:o.pos}))});
      else if(isField(s.pos)&&isField(o.pos))moves.push({n,t:fill(phr('multiItem'),{打順:n,名前:nm(np),守備位置:esc(lab(s.pos)),旧守備位置:esc(lab(o.pos))})});
      else if(isField(s.pos))items.push({k:4,n,t:`${nm(np)}が、${esc(lab(s.pos))}に入ります。`});
      return;
    }
    const ctx=Object.assign({},base,{旧名前:op?nm(op):'',旧守備位置:esc(o?lab(o.pos):'')});
    if(s.pos==='代打')items.push({k:1,n,t:fill(phr('pinchHit'),ctx)});
    else if(s.pos==='代走')items.push({k:2,n,t:fill(phr('pinchRun'),Object.assign({},ctx,{塁:baseSel(s.pid)}))});
    else if(o&&(o.pos==='代打'||o.pos==='代走'))items.push({k:3,n,t:fill(phr('afterPinch'),Object.assign({},ctx,{代打走:o.pos}))});
    else items.push({k:3,n,t:fill(phr('defSub'),ctx)});
  });
  POSKEYS.forEach(k=>{
    const pid=sd.field[k];
    if(pid&&sd.base.field[k]!==pid&&idxInOrder(sd,pid)<0&&P(sd,pid))
      items.push({k:6,n:99,t:`${esc(lab(k))}に、${nm(P(sd,pid))}が入ります。（※打順に入っていません）`});
  });
  items.sort((a,b)=>a.k-b.k||a.n-b.n);
  const out=[];
  if(items.length||moves.length){
    out.push(fill(phr(items.length?'subHead':'multiHead'),{}));
    items.forEach(x=>out.push(x.t));
    if(moves.length){
      moves.sort((a,b)=>a.n-b.n);
      out.push(moves.map(x=>x.t).join('')+fill(phr('multiFoot'),{}));
    }
  }
  return out;
}

function fieldHTML(sd,live){

    const pid=sd.field[k],p=P(sd,pid),[x,y]=FXY[k];

  }).join('')}</div>`;

function orderHTML(sd,live){
  const n=sd.order.length;
  let nxt=sd.cur>=0?(sd.cur+1)%n:0;
  for(let k=0;k<n&&!sd.order[nxt];k++)nxt=(nxt+1)%n;
  return `<div class="order">${sd.order.map((s,i)=>{
    const p=s&&P(sd,s.pid);
    const o=sd.base&&sd.base.order[i];
    const chg=live&&sd.base&&JSON.stringify(o)!==JSON.stringify(s);
    if(!p)return `<div class="orow empty" data-drop="order:${i}"><em>${i+1}</em>空き</div>`;
    const cur=sd.cur===i,nx=nxt===i&&!cur;
    const o2=(o&&o.pid===s.pid)?o.pos:'';
    const mk=(s.pos==='代打'||o2==='代打')?'<u class="mk ph">打</u>':(s.pos==='代走'||o2==='代走')?'<u class="mk pr">走</u>':'';
    return `<div class="orow ${chg?'chg':''} ${cur?'cur':''} ${nx?'nxt':''}" data-drop="order:${i}" data-pid="${p.id}" data-from="order:${i}" data-tap="batter:${i}"><em>${i+1}</em><small>${esc(lab(s.pos)||'守備未定')}</small>${mk}<b>${esc(dispName(p))}</b>${cur?'<i>今</i>':nx?'<i>次</i>':''}<span>${p.no?'#'+esc(p.no):''}</span></div>`;
  }).join('')}</div>`;
}
function mcard(p,from,sd){

function nextIdx(sd){
  const n=sd.order.length;
  let nx=sd.cur>=0?(sd.cur+1)%n:0;

/* ===== ドラッグ操作のロジック ===== */
function removeFrom(arr,pid){const i=arr.indexOf(pid);if(i>=0)arr.splice(i,1);}
const isLive=()=>S.game.phase==='live';
function dropToField(sd,pid,pos){
  const prev=sd.field[pos];if(prev===pid)return;
  const fp=fieldPosOf(sd,pid),inO=idxInOrder(sd,pid),pj=prev?idxInOrder(sd,prev):-1;
  removeFrom(sd.ph,pid);removeFrom(sd.pr,pid);
  if(fp){
    sd.field[fp]=prev||null;
    if(pj>=0&&prev)sd.order[pj].pos=fp;
  }else if(prev&&pj>=0){
    if(inO<0)sd.order[pj]={pid,pos};
    else sd.order[pj].pos='';
  }
  sd.field[pos]=pid;
  if(inO>=0)sd.order[inO].pos=pos;
}
function dropToOrder(sd,pid,i,from,key){
  if(from.startsWith('order:'))return; // 打順の入れ替えはできない
  const old=sd.order[i];
  let pos=fieldPosOf(sd,pid)||(sd.ph.includes(pid)?'代打':sd.pr.includes(pid)?'代走':'');
  if(from==='bench'){
    if(isLive()&&isBatting(key)){
      if(!old){toast('空いている打順には入れられません');return false;}
      if(!ui.sub){ui.modal={type:'subpick',pid,i};render();return false;}
      sd.order[i]={pid,pos:ui.sub==='ph'?'代打':'代走'};
      return;
    }
    pos=old?old.pos:'';
  }
  const j=idxInOrder(sd,pid);
  if(j>=0&&j!==i){
    if(isLive()){toast('打順の入れ替えはできません');return false;}
    sd.order[j]=old||null;
  }
  sd.order[i]={pid,pos};
}
function dropToFrame(sd,pid,which){
  const to=which==='ph'?sd.ph:sd.pr,other=which==='ph'?sd.pr:sd.ph;
  removeFrom(other,pid);if(!to.includes(pid))to.push(pid);
}
function dropToBench(sd,pid,from){
  if(from==='ph')removeFrom(sd.ph,pid);
  else if(from==='pr')removeFrom(sd.pr,pid);
  else if(from.startsWith('field:')){const k=from.slice(6);sd.field[k]=null;const j=idxInOrder(sd,pid);if(j>=0)sd.order[j].pos='';}
  else if(from.startsWith('order:')){
    if(isLive()){toast('試合中は打順から外せません（「編成を直す」を使ってください）');return false;}
    sd.order[+from.slice(6)]=null;
  }
}
function doDrop(pid,from,target){
  if(target===from||!S.game)return;
  const key=curKey(),sd=curSd();let r;
  if(target.startsWith('field:')){if(from.startsWith('order:')&&false)return;dropToField(sd,pid,target.slice(6));}
  else if(target.startsWith('order:'))r=dropToOrder(sd,pid,+target.slice(6),from,key);
  else if(target==='ph'||target==='pr')dropToFrame(sd,pid,target);
  else if(target==='bench')r=dropToBench(sd,pid,from);
  if(r===false)return;
  save();render();
}
function showLines(title,lines,desc){ui.modal={type:'lines',title,lines,desc:desc||''};render();}
function openBatter(i){
  const g=S.game,k=curKey(),sd=sdOf(k),s=sd.order[i];
  sd.cur=i;
  const intro=!!g.introPending;g.introPending=false;
  const no=!!s&&!sd.noSpoken.includes(s.pid);
  if(s&&no)sd.noSpoken.push(s.pid);
  save();ui.modal={type:'batter',i,key:k,intro,no};render();
}
function nextBatter(sd,i,d){
  const n=sd.order.length;
  for(let k=1;k<=n;k++){const j=((i+d*k)%n+n)%n;if(sd.order[j]&&P(sd,sd.order[j].pid))return j;}
  return i;
}
function setBattingSide(){ui.sub=null;S.game.side='my';S.game.introPending=isBatting('my');}

function act(a){
  const [k,arg]=a.split(/:(.*)/);
  if(['note','m-start','m-last','bfirst'].includes(k))ui.ret=(ui.modal&&ui.modal.type==='help')?ui.modal:null;
  switch(k){
    case 'tab':ui.tab=arg;ui.reorder=false;render();break;
    case 'side':S.game.side=arg;save();render();break;
    case 'game-new':{
      const my=$('#g-my').value,opp=$('#g-opp').value.trim(),no=$('#g-no').value.trim();
      const clubIn=$('#g-club').value.trim();if(clubIn)S.club=clubIn;
      S.game={myId:my,myFirst:$('#g-first').value==='1',inning:1,half:'top',phase:'setup',started:false,attending:true,introPending:false,vars:{'相手':opp,'試合番号':no},side:'my',sides:{my:newSide(my)},last:null};
      save();render();break;}
    case 'close':ui.modal=ui.ret||null;ui.ret=null;render();break;
    case 'menu':ui.modal={type:'help',page:'top'};render();break;
    case 'help':{const pr=arg.split(':');ui.modal={type:'help',page:pr[0],step:+pr[1]||0};render();break;}
    case 'sub':ui.sub=ui.sub===arg?null:arg;render();break;
    case 'subdo':{const m=ui.modal,sd=curSd();const o0=sd.order[m.i];sd.order[m.i]={pid:m.pid,pos:arg==='ph'?'代打':arg==='pr'?'代走':(o0?o0.pos:'')};ui.modal=null;save();render();break;}
    case 'half-next':{const g=S.game;if(g.half==='top')g.half='bottom';else{g.half='top';g.inning=(g.inning||1)+1;}setBattingSide();save();render();break;}
    case 'half-prev':{const g=S.game;if(g.half==='bottom')g.half='top';else if((g.inning||1)>1){g.half='bottom';g.inning--;}setBattingSide();save();render();break;}

/* ドラッグ＆ドロップ
   右のベンチ欄は縦スクロール優先：横に動かす or 長押しでドラッグ開始 */
let drag=null,overEl=null;
function targetAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('[data-drop]'):null;}
function beginDrag(x,y){
  const d=drag;if(!d||d.started)return;
  d.started=true;clearTimeout(d.timer);
  const r=d.el.getBoundingClientRect();
  const g=d.el.cloneNode(true);
  g.classList.add('ghost');g.removeAttribute('data-drop');g.style.width=r.width+'px';g.style.height=r.height+'px';
  document.body.appendChild(g);d.ghost=g;d.w=r.width;d.h=r.height;
  d.el.classList.add('dragging');
  moveGhost(x,y);
}
function moveGhost(x,y){
  const d=drag;
  d.ghost.style.left=(x-d.w/2)+'px';d.ghost.style.top=(y-d.h/2-24)+'px';
  const t=targetAt(x,y);
  if(overEl&&overEl!==t)overEl.classList.remove('over');
  overEl=t;if(t&&t!==d.el)t.classList.add('over');
}
document.addEventListener('pointerdown',e=>{
  if(ui.modal||(e.pointerType==='mouse'&&e.button!==0))return;
  const el=e.target.closest('[data-pid]');if(!el)return;
  drag={pid:el.dataset.pid,from:el.dataset.from,tap:el.dataset.tap,el,started:false,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId,
        scrolly:e.pointerType!=='mouse'&&!!el.closest('.right')&&!e.target.closest('.grip')};
  if(drag.scrolly)drag.timer=setTimeout(()=>{if(drag&&!drag.started)beginDrag(drag.x,drag.y);},220);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.started){
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(drag.scrolly){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){clearTimeout(drag.timer);drag=null;return;}  // 縦スクロール
      if(Math.abs(dx)>10)beginDrag(e.clientX,e.clientY);
    }else if(Math.hypot(dx,dy)>5)beginDrag(e.clientX,e.clientY);
    return;
  }
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(drag&&drag.started)e.preventDefault();},{passive:false});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;clearTimeout(d.timer);
  if(overEl){overEl.classList.remove('over');overEl=null;}
  if(d.started){
    d.ghost.remove();d.el.classList.remove('dragging');
    if(!cancel){const t=targetAt(e.clientX,e.clientY);if(t)doDrop(d.pid,d.from,t.dataset.drop);}
  }else if(!cancel&&d.tap){tap(d.tap);}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

 ['完了とやり直し','入れ替えると、変わったカードにオレンジの枠が付きます。全部終わったら「完了 → セリフ」でまとめて読む文が出ます。間違えたら「やり直し」で、直前の完了時点に戻ります。'],
 ['案内ボタン（左端）','試合の進行に合わせた放送の文が並んでいます。黄色い欄に、得点や審判の名前を入力します。文面は「設定」タブで編集できます。'],
 ['試合の情報の保存','試合の情報は、この機器に自動で保存されます。「試合を終了する」を押すまで消えません。']
];
/* ===== 戻るボタンの階層制御・終了時の確認 ===== */
let leaving=false;
function armBack(){try{history.pushState({a:1},'');}catch(e){}}
try{history.replaceState({a:0},'');armBack();}catch(e){}
function goUp(){
  if(ui.modal){
    const m=ui.modal;
    if(m.type==='help'&&m.page&&m.page!=='top'){ui.modal={type:'help',page:'top'};}
    else{ui.modal=ui.ret||null;ui.ret=null;}
    return true;
  }
  if(ui.tab==='players'&&ui.teamId){ui.teamId=null;return true;}
  if(ui.tab!=='game'){ui.tab='game';return true;}
  return false;
}
window.addEventListener('popstate',()=>{
  if(leaving)return;
  if(goUp()){render();armBack();return;}
  if(confirm('アプリを閉じますか？\n\n試合の情報は保存されています（「試合を終了する」を押すまで消えません）。')){
    leaving=true;history.back();
  }else armBack();
});
window.addEventListener('beforeunload',e=>{if(S.game&&!leaving){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
